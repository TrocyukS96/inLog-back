services:
  - type: web
    name: inlog-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://in-log-livid.vercel.app
      - key: FRONTEND_URL
        value: https://in-log-livid.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: InLog <onboarding@resend.dev>
      - key: SUPER_ADMIN_EMAIL
        sync: false
